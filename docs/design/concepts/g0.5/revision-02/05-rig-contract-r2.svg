<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#F8F6ED"/><style>text{font-family:Arial,sans-serif;fill:#39465C}.box{fill:#fff;stroke:#39465C;stroke-width:3}.line{stroke:#9279CF;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#9279CF"/></marker></defs><text x="40" y="45" font-size="26" font-weight="700">VPD Agent Rig Contract — concept diagram, no GLB built</text><rect class="box" x="80" y="150" width="220" height="100" rx="16"/><text x="130" y="195" font-size="22" font-weight="700">Base Body</text><text x="110" y="225" font-size="14">shared proportions / mesh</text><rect class="box" x="430" y="120" width="300" height="160" rx="16"/><text x="505" y="170" font-size="22" font-weight="700">Shared Skeleton</text><text x="475" y="205" font-size="14">stable bone names • +Y up</text><text x="475" y="230" font-size="14">origin at feet • 1 unit = 1 m</text><path class="line" d="M300 200 H430"/><rect class="box" x="850" y="70" width="250" height="80" rx="16"/><text x="910" y="118" font-size="20">headAnchor</text><rect class="box" x="850" y="185" width="250" height="80" rx="16"/><text x="905" y="233" font-size="20">handRightAnchor</text><rect class="box" x="850" y="300" width="250" height="80" rx="16"/><text x="920" y="348" font-size="20">seatAnchor</text><path class="line" d="M730 170 H820 V110 H850"/><path class="line" d="M730 200 H820 V225 H850"/><path class="line" d="M730 230 H820 V340 H850"/><rect class="box" x="170" y="390" width="300" height="120" rx="16"/><text x="235" y="435" font-size="22" font-weight="700">Prop Attachments</text><text x="205" y="468" font-size="14">clipboard • headset • mic • stylus</text><text x="205" y="490" font-size="14">socketed, no new bones required</text><rect class="box" x="620" y="430" width="360" height="120" rx="16"/><text x="690" y="475" font-size="22" font-weight="700">Animation Clip Slots</text><text x="650" y="507" font-size="14">idle • work • walk • meeting • handoff</text><text x="650" y="529" font-size="14">+ remaining 9 source clip names in manifest</text><path class="line" d="M500 280 V390 H470"/><path class="line" d="M650 280 V430"/><text x="40" y="610" font-size="14">Production gate: validate one base mesh, one skeleton, anchors, skinning and shared clips in GLB before duplicating 12 variants.</text></svg>
